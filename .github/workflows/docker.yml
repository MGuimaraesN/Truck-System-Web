name: Docker Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/api:latest apps/api
      - name: Build Web image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/web:latest apps/web
      - name: Build Worker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/worker:latest apps/worker
      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository }}/api:latest
          docker push ghcr.io/${{ github.repository }}/web:latest
          docker push ghcr.io/${{ github.repository }}/worker:latest
