version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truck_backend
    env_file:
      - ./.env
    environment:
      # Garante que a URL aponte para o volume montado:
      - DATABASE_URL=${DATABASE_URL:-file:/data/dev.db}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - TZ=${TZ:-America/Sao_Paulo}
      # Rode seed só quando precisar (true/false):
      - SEED=${SEED:-false}
    volumes:
      # Persistência do SQLite
      - ./database_storage:/data
      # (Opcional) CSVs de seed/backfill
      - ./data/csv:/seed/csv:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite lê em build-time; mantemos /api para proxiar ao backend
        - VITE_API_BASE=${VITE_API_BASE:-/api}
    container_name: truck_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}

# Sem volumes nomeados; bind mount na pasta ./database_storage para você versionar/backup fácil
