version: "3.9"
services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/dev.db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/data
      - ./data/input:/data/input
    depends_on: []
    profiles: ["sqlite"]

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

  worker:
    build: ./apps/worker
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/dev.db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - API_URL=http://api:3000/api
      - WORKER_EMAIL=${WORKER_EMAIL:-admin@frota.local}
      - WORKER_PASSWORD=${WORKER_PASSWORD:-password123}
    volumes:
      - sqlite_data:/data
      - ./data/input:/data/input
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web

volumes:
  sqlite_data:
