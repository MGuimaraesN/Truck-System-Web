# docker-compose.yml

# Remova esta linha -> version: "3.9"

services:
  api:
    build:
      context: . # <-- Adicione esta linha
      dockerfile: apps/api/Dockerfile # <-- Adicione esta linha
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/dev.db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/data
      - ./data/input:/data/input
    depends_on: []
    # profiles: ["sqlite"] # <-- Linha removida/comentada

  web:
    build:
      context: . # <-- Adicione esta linha
      dockerfile: apps/web/Dockerfile # <-- Adicione esta linha
    ports:
      - "5173:80"
    depends_on:
      - api

  worker:
    build:
      context: . # <-- Adicione esta linha
      dockerfile: apps/worker/Dockerfile # <-- Adicione esta linha
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/dev.db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - API_URL=http://api:3000/api
      - WORKER_EMAIL=${WORKER_EMAIL:-admin@frota.local}
      - WORKER_PASSWORD=${WORKER_PASSWORD:-password123}
    volumes:
      - sqlite_data:/data
      - ./data/input:/data/input
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web

volumes:
  sqlite_data: